<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary SEO -->
    <title>Iskawt — Interactive Philippine Province Map</title>
    <meta name="description" content="Explore all 83 Philippine provinces on an interactive map. Check live weather, track your travel level, take province quizzes, and discover fun facts about the Philippines. Free and open source." />
    <meta name="keywords" content="Philippines map, Philippine provinces, interactive map, Philippines travel, province quiz, Philippines weather, Iskawt, explore Philippines, NCR, Luzon, Visayas, Mindanao" />
    <meta name="author" content="Iskawt" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://iam-phasma.github.io/Iskawt/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iam-phasma.github.io/Iskawt/" />
    <meta property="og:title" content="Iskawt — Interactive Philippine Province Map" />
    <meta property="og:description" content="Explore all 83 Philippine provinces on an interactive map. Check live weather, track your travel level, take province quizzes, and discover fun facts about the Philippines." />
    <meta property="og:image" content="https://iam-phasma.github.io/Iskawt/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:site_name" content="Iskawt" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://iam-phasma.github.io/Iskawt/" />
    <meta name="twitter:title" content="Iskawt — Interactive Philippine Province Map" />
    <meta name="twitter:description" content="Explore all 83 Philippine provinces on an interactive map. Live weather, travel tracking, quizzes, and fun facts — free and open source." />
    <meta name="twitter:image" content="https://iam-phasma.github.io/Iskawt/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Iskawt",
      "url": "https://iam-phasma.github.io/Iskawt/",
      "description": "Explore all 83 Philippine provinces on an interactive map. Check live weather, track your travel level, take province quizzes, and discover fun facts about the Philippines.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Iam-Phasma"
      },
      "keywords": "Philippines, provinces, interactive map, travel tracker, weather, quiz",
      "inLanguage": "en-PH",
      "isAccessibleForFree": true,
      "thumbnailUrl": "https://iam-phasma.github.io/Iskawt/og-image.png"
    }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="mobile-backdrop" aria-hidden="true"></div>

      <main id="main">
        <div id="map-wrap">
          <!-- Tiltable canvas: SVG + weather overlay -->
          <div id="map-tilt-frame">
            <svg
              id="map"
              role="img"
              aria-label="Interactive map of Philippine provinces"
            ></svg>
          </div>

          <!-- Weather emoji overlay (positioned per selected province in #map-wrap space) -->
          <div id="weather-overlay" aria-hidden="true"></div>
          <div id="tooltip" class="tooltip" aria-live="polite"></div>
          <div id="zoom-controls" aria-label="Map zoom controls">
            <button id="zoom-in" title="Zoom in" aria-label="Zoom in">
              <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 7.757v8.486M7.757 12h8.486M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
              </svg>
            </button>
            <button id="zoom-reset" title="Reset view" aria-label="Reset view">
              <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h4V4m12 4h-4V4M4 16h4v4m12-4h-4v4"/>
              </svg>
            </button>
            <button id="zoom-out" title="Zoom out" aria-label="Zoom out">
              <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7.757 12h8.486M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
              </svg>
            </button>
          </div>

          <!-- Name the Map game: type-to-guess input (top-left, desktop only, draggable) -->
          <div id="naming-input-wrap" class="naming-input-wrap" aria-hidden="true">
            <button type="button" id="naming-drag-handle" class="naming-drag-handle" aria-label="Move input" title="Drag to move">⠿</button>
            <input type="text" id="naming-input" class="naming-input" placeholder="Type a province name…" autocomplete="off" spellcheck="false" />
          </div>

          <!-- Settings panel (top-right, appears on cursor proximity) -->
          <div id="settings-trigger" aria-label="Map settings">
            <button id="settings-btn" aria-label="Map Settings" title="Map Settings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div id="settings-panel">
              <div class="sp-title">SETTINGS</div>

              <div class="sp-divider"></div>

              <!-- ── Sea ── -->
              <div class="sp-section">Sea</div>
              <div class="sp-row">
                <span class="sp-row-name">Sea Texture</span>
                <button class="sp-toggle" id="sea-texture-toggle" role="switch" aria-checked="true" title="Toggle sea texture">
                  <span class="sp-toggle-track"><span class="sp-toggle-thumb"></span></span>
                </button>
              </div>
              <div class="sp-row-block">
                <div class="sp-row">
                  <span class="sp-row-name">Sea Color</span>
                  <button class="sp-icon-btn" id="sea-color-reset" title="Reset sea color">↺</button>
                </div>
                <input type="range" id="sea-color-slider" class="sp-slider sp-slider--sea" min="0" max="100" value="66">
              </div>

              <div class="sp-divider"></div>

              <!-- ── Map ── -->
              <div class="sp-section">Map</div>
              <div class="sp-row">
                <span class="sp-row-name">Province Borders</span>
                <button class="sp-toggle" id="borders-toggle" role="switch" aria-checked="true" title="Toggle province borders">
                  <span class="sp-toggle-track"><span class="sp-toggle-thumb"></span></span>
                </button>
              </div>
              <div class="sp-row-block">
                <div class="sp-row">
                  <span class="sp-row-name">Land Color</span>
                  <button class="sp-icon-btn" id="land-color-reset" title="Reset land color">↺</button>
                </div>
                <input type="range" id="land-color-slider" class="sp-slider sp-slider--land" min="0" max="100" value="50">
              </div>
              <div class="sp-row-block">
                <div class="sp-row">
                  <span class="sp-row-name">Border Color</span>
                </div>
                <div class="sp-swatches" id="border-swatches">
                  <button class="sp-swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
                  <button class="sp-swatch" data-color="#95ffc1" style="background:#95ffc1" title="Mint"></button>
                  <button class="sp-swatch" data-color="#4ade80" style="background:#4ade80" title="Green"></button>
                  <button class="sp-swatch" data-color="#166e3e" style="background:#166e3e" title="Dark Green"></button>
                  <button class="sp-swatch" data-color="#0a3d1f" style="background:#0a3d1f" title="Darkest Green"></button>
                  <button class="sp-swatch" data-color="#000000" style="background:#000000" title="Black" aria-pressed="true"></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Mobile FAB: opens tools sheet (visible on ≤640px) -->
          <button id="mobile-fab" aria-label="Open tools panel" title="Open tools">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Tools
          </button>

          <!-- Tilt controls (bottom-left) -->
          <div id="tilt-controls" aria-label="Map tilt controls">
            <svg class="tilt-icon" width="15" height="15" viewBox="0 0 15 15" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <!-- vanishing-point perspective icon -->
              <line x1="7.5" y1="2" x2="1" y2="13"/>
              <line x1="7.5" y1="2" x2="14" y2="13"/>
              <line x1="1" y1="13" x2="14" y2="13"/>
              <line x1="3.5" y1="8.8" x2="11.5" y2="8.8"/>
            </svg>
            <input type="range" id="tilt-slider" min="0" max="30" value="0" step="1"
              class="tilt-slider-input" aria-label="Map tilt angle" title="Map tilt (0–30°)">
            <button id="tilt-reset" title="Reset tilt" aria-label="Reset tilt">⊙</button>
          </div>

          <!-- Travel level picker popup (appears over map on province click) -->
          <div id="tl-picker-popup" class="tl-picker-popup" aria-hidden="true"></div>
        </div>

        <aside id="sidebar" aria-label="Province information">
          <div class="sidebar-inner">
            <!-- Drag handle — visible only on mobile -->
            <div class="mobile-sheet-handle" aria-hidden="true"><span class="mobile-sheet-grip"></span></div>
            <div class="sidebar-header">
              <div class="sidebar-title" id="sidebar-title">Tools</div>
            </div>
            <div id="info-panel"></div>
            <div class="sidebar-footer" id="visitor-counter" title="Total site visitors" aria-live="polite">
              <span class="sidebar-footer-icon">👀</span>
              <span id="visitor-count">—</span>
              <span>visitors</span>
            </div>
          </div>
        </aside>
      </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5/build/player/lottie.min.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
    <!-- Tools (must load after app.js; travel before roulette) -->
    <script src="js/tools/weather.js" defer></script>
    <script src="js/tools/quiz.js" defer></script>
    <script src="js/tools/travel.js" defer></script>
    <script src="js/tools/roulette.js" defer></script>
    <script src="js/tools/localguesser.js" defer></script>
    <script src="js/tools/naming.js" defer></script>
    <!-- Boot: runs last, after all tools are defined -->
    <script src="js/boot.js" defer></script>
  </body>
</html>
